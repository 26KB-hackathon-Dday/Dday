name: CI

# 모노레포라서 경로 필터가 필요하다. 이게 없으면 프론트 CSS 한 줄만 고쳐도
# 백엔드가 재빌드되고 EC2가 재배포된다 — 시연 중에 프론트를 고치다가
# 백엔드가 몇 초 502가 되는 사고가 실제로 난다.
# (프론트는 Cloudflare Workers Builds가 별도로 담당한다)
on:
  pull_request:
    branches: [main]
    paths: &backend-paths
      - 'backend/**'
      # 이 파일 자체를 고쳤을 때도 돌아야 한다. 빼면 워크플로 수정이 검증 없이 머지된다.
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *backend-paths
  # 수동 실행에는 경로 필터가 걸리지 않는다.
  # 코드 변경 없이 재배포하거나 배선만 확인할 때의 탈출구다.
  workflow_dispatch:
    inputs:
      logs_only:
        description: '배포하지 않고 운영 로그만 가져온다'
        type: boolean
        default: false
      reset_db:
        description: "⚠️ 운영 DB를 통째로 지우고 다시 만든다. 실행하려면 RESET 을 그대로 입력"
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  # main에서는 취소하지 않는다. 이미지 push와 서버 배포 사이에서 죽으면
  # 서버가 옛 이미지를 물고 있는 어중간한 상태가 된다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # GHCR 경로는 전부 소문자여야 한다. ${{ github.repository }}는 대문자가 섞여 있어(26KB.../Dday)
  # 그대로 쓰면 docker push가 거부한다 — 그래서 박아둔다.
  IMAGE: ghcr.io/26kb-hackathon-dday/dday-backend

jobs:
  # ── 1. 컴파일 + 테스트 ────────────────────────────────────────────────────
  build:
    if: ${{ !inputs.logs_only && inputs.reset_db != 'RESET' }}
    runs-on: ubuntu-latest

    # backend/.env.sample과 동일한 로컬 개발 전용 값이다 (운영 비밀값 아님).
    # 그 파일을 고치면 여기도 함께 맞춘다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: dday
          MYSQL_USER: dday
          MYSQL_PASSWORD: dday1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 프로파일 기본값이 local이라 설정을 갈아끼우는 단계가 없다.
      # application-local.yml의 기본값이 위 service 컨테이너와 짝이 맞는다.
      - name: Build & test
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: backend/build/reports/tests/test

  # ── 2. 도커 이미지 빌드 + GHCR push ───────────────────────────────────────
  image:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && !inputs.logs_only && inputs.reset_db != 'RESET' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN으로 충분하다. PAT를 따로 만들 필요 없다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          # latest는 서버가 늘 바라보는 태그, sha 태그는 "어느 커밋이 떠 있나"를 되짚고
          # 롤백할 때 쓴다.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. EC2 배포 ───────────────────────────────────────────────────────────
  # 저장소 Variable DEPLOY_ENABLED=true 일 때만 돈다.
  # EC2를 아직 안 만들었으면 이 잡은 통째로 건너뛴다 — main push가 빨갛게 뜨지 않는다.
  # 배포가 아니라 "지금 서버가 왜 이러는지"를 볼 때 쓴다. 500이 나는데 EC2 SSH 키를 가진
  # 사람이 없으면 아무도 원인을 못 보므로, Actions에서 로그만 떠올 수 있게 열어둔다.
  #   gh workflow run ci.yml -f logs_only=true
  logs:
    if: ${{ inputs.logs_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Dump backend logs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/dday
            echo "===== 컨테이너 상태 ====="
            docker compose -f docker-compose.prod.yml ps -a
            echo "===== backend 로그 (최근 300줄) ====="
            docker compose -f docker-compose.prod.yml logs backend --tail 300 --no-color

  # ⚠️ **운영 DB를 통째로 지운다.** ddl-auto: update 는 컬럼 이름·타입 변경과 삭제를
  # 반영하지 못해서, 엔티티를 고치다 보면 운영 스키마가 어긋나 런타임에 터진다
  # (Unknown column 'p1_0.pocket_id' 같은 형태). 해커톤 동안 그때마다 빠르게 초기화하려고 둔다.
  #
  # 실수로 도는 걸 막으려고 reset_db 에 정확히 RESET 을 입력해야만 실행된다.
  #   gh workflow run ci.yml -f reset_db=RESET
  #
  # 지워지는 것: 회원·거래·예산 등 전부. data.sql 시드는 재기동 때 자동 복원된다.
  # **실사용 데이터가 생긴 뒤에는 이 잡을 지운다.**
  reset-db:
    if: ${{ inputs.reset_db == 'RESET' }}
    runs-on: ubuntu-latest
    steps:
      - name: Drop & recreate database, then restart backend
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/dday

            # 접속정보는 서버 .env 에만 있다. 저장소로 끌어오지 않는다.
            set -a; . ./.env; set +a
            DB="${DB_NAME:-dday}"

            # 백엔드에는 mysql 클라이언트가 없어서 일회용 컨테이너로 붙는다.
            # utf8mb4 를 빼면 한글이 깨진다.
            docker run --rm mysql:8.4 mysql               -h "$DB_HOST" -u "$DB_USERNAME" -p"$DB_PASSWORD"               -e "DROP DATABASE IF EXISTS \`$DB\`; CREATE DATABASE \`$DB\` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

            echo "DB 재생성 완료: $DB"

            # 재기동해야 ddl-auto 가 스키마를 만들고 data.sql 이 시드를 넣는다.
            docker compose -f docker-compose.prod.yml restart backend

      - name: Health check
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 5 "http://${{ secrets.EC2_HOST }}/health/db"; then
              echo ""; echo "재생성 후 정상 기동"; exit 0
            fi
            echo "대기 중... ($i/24)"; sleep 5
          done
          echo "::error::재생성 후 120초 안에 뜨지 않았다. logs_only=true 로 로그를 확인할 것"
          exit 1

  deploy:
    needs: image
    if: ${{ vars.DEPLOY_ENABLED == 'true' && !inputs.logs_only && inputs.reset_db != 'RESET' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 서버가 GHCR에서 이미지를 받으려면 읽기 권한이 필요하다.
      packages: read

    steps:
      - uses: actions/checkout@v7

      # 서버에 저장소를 클론해두지 않는다. 배포에 필요한 건 compose 파일 하나뿐이라
      # 그것만 올린다.
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/docker-compose.prod.yml
          # strip_components를 빼면 서버에 ~/dday/backend/docker-compose.prod.yml로
          # 들어가서 다음 단계의 cd 경로와 어긋난다.
          strip_components: 1
          target: /home/${{ secrets.EC2_USER }}/dday

      - name: Pull & restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          # 이 잡이 도는 동안만 유효한 토큰이다. pull 직전에 로그인하므로 만료를 걱정할 게 없고,
          # 덕분에 GHCR 패키지를 public으로 열지 않아도 된다 (PAT를 서버에 두는 것보다 안전하다).
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # data.go.kr 복지서비스 수집 키. 리포 Secret에 있으면 서버 .env에 반영한다.
          # 비어 있어도 배포는 정상 — 수집 잡만 실패한다 (docker-compose.prod.yml 참고).
          WELFARE_API_KEY: ${{ secrets.WELFARE_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,WELFARE_API_KEY
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/dday
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # JWT 서명키는 저장소에 둘 수 없고(공개되면 누구나 토큰을 위조한다) compose가
            # 없으면 기동을 거부한다. 그래서 서버에 한 번 만들어 .env에 남긴다.
            #
            # 두 번째 배포부터는 이미 있으므로 건너뛴다 — 매번 새로 만들면 배포할 때마다
            # 발급된 토큰이 전부 무효가 되어 사용자가 로그아웃된다.
            #
            # 키를 바꾸려면(유출 등) 서버에서 .env의 JWT_SECRET 줄을 지우고 재배포한다.
            if ! grep -q '^JWT_SECRET=' .env 2>/dev/null; then
              echo "JWT_SECRET=$(head -c 48 /dev/urandom | base64 | tr -d '\n')" >> .env
              echo "JWT_SECRET 을 새로 생성해 .env 에 넣었다."
            fi

            # 복지서비스 수집 키. JWT와 달리 매 배포 최신값으로 맞춘다 (리포 Secret이 정본).
            # Secret이 비어 있으면 건드리지 않는다 — 서버에 이미 넣어둔 값이 있으면 지우지 않기 위해서.
            if [ -n "$WELFARE_API_KEY" ]; then
              if grep -q '^WELFARE_API_KEY=' .env 2>/dev/null; then
                sed -i "s|^WELFARE_API_KEY=.*|WELFARE_API_KEY=$WELFARE_API_KEY|" .env
              else
                echo "WELFARE_API_KEY=$WELFARE_API_KEY" >> .env
              fi
              echo "WELFARE_API_KEY 를 .env 에 반영했다."
            fi

            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d
            # 태그가 바뀌면서 참조를 잃은 옛 이미지를 정리한다. 20GB 디스크가 금방 찬다.
            docker image prune -f

      - name: Health check
        run: |
          # 앱이 뜨는 데 시간이 걸린다. 최대 90초까지 기다린다.
          for i in $(seq 1 18); do
            if curl -fsS --max-time 5 "http://${{ secrets.EC2_HOST }}/health/db"; then
              echo ""; echo "배포 성공"; exit 0
            fi
            echo "대기 중... ($i/18)"; sleep 5
          done
          echo "::error::/health/db 가 90초 안에 응답하지 않았다. 아래 'Dump backend logs' 단계의 로그를 확인할 것"
          exit 1

      # 배포가 깨졌을 때 EC2에 SSH로 들어가야만 원인을 알 수 있으면, 키를 가진 사람이
      # 붙을 때까지 아무도 손을 못 쓴다. 실패했을 때만 로그를 여기로 끌어온다.
      - name: Dump backend logs
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/dday
            echo "===== 컨테이너 상태 ====="
            docker compose -f docker-compose.prod.yml ps -a
            echo "===== backend 로그 (최근 200줄) ====="
            docker compose -f docker-compose.prod.yml logs backend --tail 200 --no-color
