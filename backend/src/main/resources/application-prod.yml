# 운영(EC2)용. 값 자리에 환경변수 참조만 둔다 — 저장소에 비밀값을 커밋하지 않는다.
# 환경변수는 서버의 .env가 docker compose를 통해 컨테이너로 주입한다.
# 기본값을 주지 않았으므로 변수가 비면 기동 단계에서 실패한다 (의도된 동작).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    show-sql: false

logging:
  level:
    root: info
    com.dday: info

app:
  cors:
    # 배포된 프론트 주소. 서버 .env의 CORS_ALLOWED_ORIGINS로 넣는다.
    # 미지정이면 전부 허용 — 해커톤 기간 한정이고, 공개 서비스라면 반드시 좁혀야 한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
