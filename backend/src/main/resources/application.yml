
# 모든 프로파일 공통 설정. 환경마다 달라지는 값(DB 접속정보, CORS 출처)은
# application-{local,prod}.yml에만 둔다.
spring:
  application:
    name: dday
  profiles:
    # 프로파일을 지정하지 않고 띄우면 local이다. 운영은 SPRING_PROFILES_ACTIVE=prod로 덮는다.
    default: local

  jackson:
    time-zone: Asia/Seoul
    serialization:
      # LocalDateTime을 [2026,9,2,10,0] 배열이 아니라 ISO-8601 문자열로 내보낸다.
      # 끄면 프론트가 Date로 파싱하지 못한다.
      write-dates-as-timestamps: false
    default-property-inclusion: always

  # 시드 데이터 — src/main/resources/data.sql 을 앱이 뜰 때마다 실행한다.
  # 로컬에서 뜨면 로컬 MySQL에, 서버에서 뜨면 RDS에 들어간다.
  # 두 DB를 직접 동기화하는 게 아니라, 같은 파일에서 각각 채워지는 구조다.
  sql:
    init:
      # 기본값은 embedded(H2 등)뿐이라 MySQL에는 안 돈다. 명시해야 실행된다.
      mode: always
      # ⚠️ 지정하지 않으면 플랫폼 기본 인코딩으로 읽는다. 윈도우(MS949)에서 띄우면
      #    data.sql의 한글이 U+FFFD로 깨진 채 DB에 들어간다 — DB·컬럼이 utf8mb4여도
      #    저장 전에 이미 망가져서 나중에 고칠 수 없다.
      encoding: UTF-8
      # 실패하면 앱이 안 뜬다(기본값 false). 시드가 깨진 걸 모르고 서비스되는 것보다 낫다.
      continue-on-error: false

  jpa:
    # ⚠️ data.sql이 ddl-auto보다 "뒤에" 실행되게 한다.
    # 이게 없으면 테이블이 만들어지기 전에 data.sql이 돌아 Table doesn't exist로 죽는다.
    defer-datasource-initialization: true
    # 컨트롤러/뷰까지 영속성 컨텍스트를 열어두지 않는다. 켜두면 커넥션을 요청 끝까지
    # 붙들고 있어서 부하가 조금만 올라가도 풀이 마른다. 대신 지연 로딩은 트랜잭션(서비스)
    # 안에서 끝내야 하고, 밖에서 건드리면 LazyInitializationException이 난다 — 의도된 동작이다.
    open-in-view: false
    hibernate:
      # 엔티티를 고치면 스키마가 따라온다. 해커톤 3일 동안은 이게 가장 빠르다.
      # 대가: 컬럼 삭제/타입 변경은 반영되지 않고 조용히 남는다. 이상해지면
      # `docker compose down -v && docker compose up -d`로 DB를 새로 만든다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # N+1을 한 방에 없애주진 않지만, 지연 로딩이 터질 때 쿼리 수를 100개에서 10개로 줄인다.
        default_batch_fetch_size: 100

  # 복지서비스 수집 배치 (domain/welfare).
  batch:
    job:
      # ⚠️ 스프링 배치의 "기동 시 등록된 잡 전부 실행"은 끈다. 안 그러면 배포·CI 기동마다
      #    외부 API를 때린다 (CI엔 WELFARE_API_KEY도 없다).
      #    수집 실행 경로는 WelfareCollectScheduler(매월 1일) · WelfareCollectBootstrap(최초 1회,
      #    키가 있고 수집 이력이 없을 때) · 로컬 수동 엔드포인트뿐이다.
      enabled: false
    jdbc:
      # BATCH_JOB_INSTANCE 등 메타테이블을 만든다. Batch 5의 schema-mysql.sql은
      # CREATE TABLE IF NOT EXISTS라 매 기동 돌아도 안전하다.
      initialize-schema: always

# JWT. JwtTokenProvider가 생성자에서 @Value로 읽는다 — 값이 비면 기동 단계에서 죽는다.
jwt:
  # HS256 서명키. Base64든 평문이든 받지만 어느 쪽이든 디코딩 결과가 32바이트 이상이어야 한다.
  # ⚠️ 운영에서는 반드시 JWT_SECRET 환경변수로 덮는다. 아래 기본값은 로컬 전용이고 저장소에 공개돼 있다.
  secret: ${JWT_SECRET:dday-local-development-only-secret-key-please-override-in-production}
  # 밀리초. 해커톤 기간에는 시연 도중 토큰이 만료되는 게 더 큰 사고라 길게 잡았다.
  # 공개 서비스로 갈 때는 액세스를 30분~2시간으로 줄이고 리프레시 회전을 붙여야 한다.
  access-token-validity: 31536000000    # 365일
  refresh-token-validity: 315360000000  # 10년

server:
  port: 8080
  # 에러 응답은 GlobalExceptionHandler가 만든다. 스프링 기본 흰 화면(/error)을 끈다.
  error:
    whitelabel:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── 복지서비스 수집기 ─────────────────────────────────────────────────────────
# 한국사회보장정보원_중앙부처복지서비스 API. 스펙·필드 의미는 docs/welfare-api/NOTES.md,
# 동작은 docs/welfare-collector.md.
welfare:
  api:
    # CENTRAL — 목록 GET /NationalWelfarelistV001, 상세 GET /NationalWelfaredetailedV001
    base-url: http://apis.data.go.kr/B554287/NationalWelfareInformationsV001
    # LOCAL(지자체) — 목록 GET /LcgvWelfarelist, 상세 GET /LcgvWelfaredetailed (NOTES.md §11)
    local-base-url: http://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations
    # data.go.kr 발급 "일반 인증키(Decoding)" 값. 인코딩 키(%2B 포함)를 넣으면 이중 인코딩된다.
    # 비어 있으면 앱은 뜨지만 수집 잡은 실패한다 (CI·로컬 기본 상태). CENTRAL·LOCAL 공용.
    service-key: ${WELFARE_API_KEY:}
    # 생애주기 코드 — 004 = 청년. 코드표가 바뀌면 이 값만 교체한다.
    life-code: "004"
    # LOCAL은 키워드로 좁게 긁는다 — 자립준비청년 전용 지자체 제도만 (NOTES.md §11-2).
    local-search-word: 자립준비청년
    page-size: 10
    connect-timeout: 3s
    read-timeout: 10s
  collect:
    # 매월 1일 00:00 (KST). 로컬에서 즉시 돌리려면 POST /internal/welfare/collect (local 프로파일).
    cron: "0 0 0 1 * *"
    zone: Asia/Seoul
