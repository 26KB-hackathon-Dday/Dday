plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dday'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// .env를 읽어 bootRun/test 환경변수로 넘긴다 (docker-compose.yml과 같은 디렉터리).
// 개발자마다 MySQL 포트가 다를 수 있는데(3306이 이미 쓰이는 경우가 흔하다),
// .env 한 곳만 고치면 docker compose와 앱이 같은 값을 보게 하려는 배선이다.
// 파일이 없으면 조용히 넘어가고 application-local.yml의 기본값이 쓰인다.
def dotenv = { ->
    def f = rootProject.file('.env')
    def map = [:]
    if (f.exists()) {
        f.eachLine { line ->
            line = line.trim()
            if (line && !line.startsWith('#') && line.contains('=')) {
                def i = line.indexOf('=')
                map[line.substring(0, i).trim()] = line.substring(i + 1).trim()
            }
        }
    }
    return map
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 복지서비스 수집 배치 (domain/welfare). 매월 1일 외부 API를 긁어와 청년 대상 여부를 룰로 판정한다.
    // BATCH_* 메타테이블은 application.yml의 spring.batch.jdbc.initialize-schema로 만든다.
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 복지 API 응답이 XML이라 필요하다 (<wantedList>/<wantedDtl>).
    // ⚠️ jackson-dataformat-xml을 쓰면 MVC가 우리 JSON 응답까지 XML로 바꿔버린다
    //    (MappingJackson2XmlHttpMessageConverter의 canWrite가 너무 넓다). JAXB의
    //    Jaxb2RootElementHttpMessageConverter는 @XmlRootElement 타입만 다뤄서 안전하다.
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime'

    // Swagger UI: http://localhost:8080/swagger-ui.html
    // 프론트가 API 모양을 훑는 보조 수단이다. 정본은 코드다 (AGENTS.md §5).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootRun') {
    environment dotenv()
}

tasks.named('test') {
    environment dotenv()
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// 배포 이미지에 들어가는 건 bootJar 하나다. plain jar는 만들지 않는다.
tasks.named('jar') {
    enabled = false
}
