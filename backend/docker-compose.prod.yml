# EC2 서버용. 백엔드 컨테이너 하나만 띄운다.
#
# DB는 이 박스에 없다 — RDS를 쓴다. 접속정보는 서버의 .env에 있고,
# 이 파일은 저장소에서 서버로 복사되지만 .env는 커밋되지 않는다.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 로컬 개발은 이 파일이 아니라 docker-compose.yml(MySQL 컨테이너)을 쓴다.
# 로컬에서까지 RDS에 붙으면 5명이 같은 DB를 밟는다.

# 프로젝트 이름 고정 — 서버의 어느 경로에 두든 컨테이너 이름이 흔들리지 않는다.
name: dday

services:
  backend:
    # main에 머지되면 Actions가 이 태그를 새로 밀어넣는다.
    image: ghcr.io/26kb-hackathon-dday/dday-backend:latest
    container_name: dday-backend
    restart: unless-stopped

    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod

      # JDBC URL을 .env에 통째로 넣지 않고 호스트만 받아서 여기서 조립한다.
      # 쿼리 파라미터(serverTimezone 등)를 저장소에 남겨두려는 것이다 —
      # .env에 URL 전체를 적게 하면 누군가 엔드포인트만 붙여넣다가 파라미터를 통째로 빠뜨린다.
      DB_URL: jdbc:mysql://${DB_HOST:?DB_HOST 에 RDS 엔드포인트를 넣어야 한다}:3306/${DB_NAME:-dday}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=REQUIRED&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env에 넣어야 한다}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

    ports:
      - "80:8080"

    # JVM 힙은 Dockerfile의 -XX:MaxRAMPercentage=75 가 정한다.
    # DB가 이 박스에 없으므로 메모리를 나눠 쓸 상대가 없어 mem_limit을 걸지 않는다.
    # (컨테이너를 더 얹게 되면 그때 한도를 갈라야 한다)

    logging:
      # 기본 설정은 로그를 무한히 쌓아서 며칠이면 디스크가 찬다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
